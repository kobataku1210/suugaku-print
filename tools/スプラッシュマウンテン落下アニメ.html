<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スプラッシュマウンテン 落下アニメ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Yu Gothic", "游ゴシック", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #0b2447 0%, #19376d 100%);
    color: #fff;
    margin: 0;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-size: 24px;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    align-items: stretch;
  }
  .stage {
    background: linear-gradient(180deg, #c8e6ff 0%, #86b6e4 60%, #4a7cb0 100%);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
    overflow: hidden;
  }
  svg.scene { display: block; width: 100%; height: auto; max-height: 70vh; }
  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel {
    background: #fff;
    color: #1f3a5f;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .readout .big {
    font-size: 36px;
    font-weight: 700;
    font-family: "Cambria Math", serif;
    color: #c0392b;
    letter-spacing: 1px;
  }
  .readout .lbl {
    font-size: 13px;
    color: #5c6b80;
    margin-right: 6px;
  }
  .readout .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 4px 0;
  }
  table.tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
    margin-top: 6px;
  }
  table.tbl th, table.tbl td {
    border: 2px solid #1f3a5f;
    text-align: center;
    padding: 8px 2px;
    font-family: "Cambria Math", serif;
  }
  table.tbl th {
    background: #e8f0fc;
    font-weight: 700;
    width: 18%;
    font-size: 15px;
  }
  table.tbl td {
    background: #fff;
    transition: background .3s, color .3s;
    font-size: 18px;
    font-weight: 700;
  }
  table.tbl td.hit {
    background: #fff2cc;
    color: #c0392b;
    animation: pop .5s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.5); background: #ffd54f; }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  button {
    font: inherit;
    padding: 10px 6px;
    border: 2px solid #1f3a5f;
    background: #1f3a5f;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #2e5080; }
  button:active { transform: scale(.95); }
  button.primary {
    background: #c0392b;
    border-color: #c0392b;
  }
  button.primary:hover { background: #e74c3c; }
  button.secondary {
    background: #fff;
    color: #1f3a5f;
  }
  button.secondary:hover { background: #e8f0fc; }
  button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #1f3a5f;
    margin-top: 4px;
  }
  .speed input { flex: 1; }
  .hint {
    font-size: 12px;
    color: #5c6b80;
    text-align: center;
    margin-top: 4px;
  }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    svg.scene { max-height: 60vh; }
  }
</style>
</head>
<body>

<h1>🎢 スプラッシュマウンテン 落下アニメ</h1>

<div class="wrap">
  <!-- ステージ -->
  <div class="stage">
    <svg class="scene" viewBox="0 0 480 620" preserveAspectRatio="xMidYMid meet">
      <!-- 背景の空 (グラデはCSSで本体に) -->

      <!-- 山（右側に斜面） -->
      <path d="M 320 0 L 480 0 L 480 620 L 420 620 L 395 560 L 405 480 L 385 400 L 400 320 L 380 240 L 400 160 L 370 80 L 390 20 Z"
            fill="#5d4037" opacity="0.5"/>
      <path d="M 340 0 L 480 0 L 480 60 L 440 120 L 460 200 L 420 300 L 455 400 L 430 500 L 460 620 L 340 620 Z"
            fill="#3e2723" opacity="0.3"/>

      <!-- トラック（イカダが走る線） -->
      <line x1="200" y1="40" x2="200" y2="565" stroke="#8b4513" stroke-width="4" stroke-linecap="round"/>
      <line x1="220" y1="40" x2="220" y2="565" stroke="#8b4513" stroke-width="4" stroke-linecap="round"/>
      <!-- 枕木 (30px 間隔) -->
      <g stroke="#5d4037" stroke-width="2" id="ties"></g>

      <!-- 目盛り (0 〜 50m, 1m = 10px, 頂上 y=50) -->
      <g font-family="Cambria Math" font-size="12" fill="#1a1a1a">
        <!-- 縦軸 -->
        <line x1="110" y1="50" x2="110" y2="560" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 目盛り線 & ラベル (5m 刻み) -->
        <g id="scale"></g>
      </g>

      <!-- 4m 地点：写真撮影 -->
      <g>
        <line x1="60" y1="90" x2="420" y2="90" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>
        <rect x="30" y="78" width="78" height="22" rx="11" fill="#e74c3c"/>
        <text x="69" y="94" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">📷 4m</text>
      </g>

      <!-- 16m 地点：マーク -->
      <g>
        <line x1="60" y1="210" x2="420" y2="210" stroke="#f39c12" stroke-width="2" stroke-dasharray="6,3"/>
        <rect x="30" y="198" width="78" height="22" rx="11" fill="#f39c12"/>
        <text x="69" y="214" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🏁 16m</text>
      </g>

      <!-- 50m 地点：ゴール（水面） -->
      <g>
        <line x1="60" y1="550" x2="420" y2="550" stroke="#27ae60" stroke-width="3"/>
        <rect x="30" y="538" width="78" height="22" rx="11" fill="#27ae60"/>
        <text x="69" y="554" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">💧 50m</text>
      </g>

      <!-- 山頂（スタート） -->
      <g>
        <rect x="150" y="20" width="120" height="24" rx="4" fill="#8b4513"/>
        <text x="210" y="37" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">⛰ 山頂（スタート）</text>
      </g>

      <!-- イカダ（SVGグループ、JS で transform で動かす） -->
      <g id="boat" transform="translate(210, 50)">
        <!-- 水しぶき（落下中は非表示） -->
        <g id="splash" opacity="0">
          <circle cx="-20" cy="10" r="4" fill="#fff" opacity="0.8"/>
          <circle cx="20" cy="12" r="5" fill="#fff" opacity="0.7"/>
          <circle cx="-10" cy="-4" r="3" fill="#fff" opacity="0.8"/>
          <circle cx="15" cy="-6" r="3" fill="#fff" opacity="0.7"/>
        </g>
        <!-- 本体 -->
        <ellipse cx="0" cy="10" rx="30" ry="10" fill="#5d4037"/>
        <ellipse cx="0" cy="5" rx="30" ry="10" fill="#8b4513"/>
        <!-- 木目 -->
        <line x1="-25" y1="2" x2="25" y2="2" stroke="#5d4037" stroke-width="1" opacity="0.6"/>
        <line x1="-25" y1="7" x2="25" y2="7" stroke="#5d4037" stroke-width="1" opacity="0.6"/>
        <!-- 人（簡易） -->
        <circle cx="-10" cy="-4" r="4" fill="#ffdbac"/>
        <rect x="-13" y="-1" width="6" height="4" fill="#2196f3"/>
        <circle cx="8" cy="-4" r="4" fill="#ffdbac"/>
        <rect x="5" y="-1" width="6" height="4" fill="#e74c3c"/>
      </g>

      <!-- 落下軌跡の点 (1秒毎) -->
      <g id="trail"></g>

    </svg>
  </div>

  <!-- サイドパネル -->
  <div class="side">
    <div class="panel readout">
      <div class="row">
        <span class="lbl">時刻</span>
        <span><span id="time" class="big">0.00</span> <span style="font-size:16px">秒</span></span>
      </div>
      <div class="row">
        <span class="lbl">落下距離</span>
        <span><span id="dist" class="big" style="color:#1565c0">0.0</span> <span style="font-size:16px">m</span></span>
      </div>
    </div>

    <div class="panel">
      <div style="font-size:14px; font-weight:700; color:#1f3a5f; margin-bottom:4px;">📋 落下距離の表</div>
      <table class="tbl">
        <tr><th>x (秒)</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
        <tr><th>y (m)</th><td id="y1">?</td><td id="y2">?</td><td id="y3">?</td><td id="y4">?</td><td id="y5">?</td></tr>
      </table>
      <div class="hint">★ 1 秒ごとにどれだけ 落ちるか 見てね</div>
    </div>

    <div class="panel">
      <div class="controls">
        <button class="primary" id="btnPlay">▶ スタート</button>
        <button id="btnPause">⏸ 一時停止</button>
        <button class="secondary" id="btnStep">▶| 1秒進める</button>
        <button class="secondary" id="btnReset">🔄 リセット</button>
      </div>
      <div class="speed">
        <span>速度</span>
        <input type="range" id="speed" min="0.2" max="1.5" step="0.1" value="0.6">
        <span id="speedVal">×0.6</span>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  // ===== 定数 =====
  const START_Y_PX = 50;      // SVG 上での 0m 位置 (y座標)
  const PX_PER_M = 10;        // 1m = 10px (0〜50m = 500px)
  const MAX_T = 5.0;          // 5秒まで（50m）落ちる
  const MAX_Y = 50;           // 50m まで

  // ===== 要素 =====
  const boat = document.getElementById('boat');
  const splash = document.getElementById('splash');
  const timeEl = document.getElementById('time');
  const distEl = document.getElementById('dist');
  const trail = document.getElementById('trail');
  const scaleG = document.getElementById('scale');
  const tiesG = document.getElementById('ties');
  const yCells = {
    1: document.getElementById('y1'),
    2: document.getElementById('y2'),
    3: document.getElementById('y3'),
    4: document.getElementById('y4'),
    5: document.getElementById('y5'),
  };
  const speedInput = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const btnPlay = document.getElementById('btnPlay');
  const btnPause = document.getElementById('btnPause');
  const btnStep = document.getElementById('btnStep');
  const btnReset = document.getElementById('btnReset');

  // ===== 目盛り生成 (0, 5, 10, ..., 50 m) =====
  for (let m = 0; m <= 50; m += 5) {
    const y = START_Y_PX + m * PX_PER_M;
    const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    tick.setAttribute('x1', 95); tick.setAttribute('y1', y);
    tick.setAttribute('x2', 110); tick.setAttribute('y2', y);
    tick.setAttribute('stroke', '#1a1a1a'); tick.setAttribute('stroke-width', 2);
    scaleG.appendChild(tick);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', 90); label.setAttribute('y', y + 4);
    label.setAttribute('text-anchor', 'end');
    label.setAttribute('font-family', 'Cambria Math');
    label.setAttribute('font-size', 12);
    label.setAttribute('fill', '#1a1a1a');
    label.textContent = m + 'm';
    scaleG.appendChild(label);
  }

  // ===== 枕木を生成 (25px 間隔) =====
  for (let y = 70; y <= 560; y += 25) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 195); line.setAttribute('y1', y);
    line.setAttribute('x2', 225); line.setAttribute('y2', y);
    tiesG.appendChild(line);
  }

  // ===== 物理モデル =====
  // y = 2 * t^2  (重力加速度 ~ 4 m/s² 相当。問題文の設定)
  function distanceAt(t) {
    if (t < 0) return 0;
    if (t > MAX_T) return MAX_Y;
    return 2 * t * t;
  }

  // ===== 状態 =====
  let t = 0;             // 現在時刻 (秒・物理)
  let playing = false;
  let lastRaf = null;
  let hits = { 1: false, 2: false, 3: false, 4: false, 5: false };

  function render(t) {
    const y_m = distanceAt(t);
    const y_px = START_Y_PX + y_m * PX_PER_M;
    boat.setAttribute('transform', `translate(210, ${y_px})`);
    timeEl.textContent = t.toFixed(2);
    distEl.textContent = y_m.toFixed(1);

    // ゴールしたら水しぶき
    if (t >= MAX_T) {
      splash.setAttribute('opacity', 1);
    } else {
      splash.setAttribute('opacity', 0);
    }

    // 1〜5秒 ヒット時に表を埋める + 軌跡の点
    for (const sec of [1, 2, 3, 4, 5]) {
      if (t >= sec && !hits[sec]) {
        hits[sec] = true;
        const y_sec = distanceAt(sec);
        const target = yCells[sec];
        target.textContent = y_sec;
        target.classList.add('hit');
        // 軌跡の点を描く
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const px = 240; // 右側に少しずらす
        const py = START_Y_PX + y_sec * PX_PER_M;
        const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circ.setAttribute('cx', px); circ.setAttribute('cy', py);
        circ.setAttribute('r', 5); circ.setAttribute('fill', '#c0392b');
        circ.setAttribute('stroke', '#fff'); circ.setAttribute('stroke-width', 1.5);
        dot.appendChild(circ);
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', px + 10); label.setAttribute('y', py + 5);
        label.setAttribute('font-family', 'Cambria Math');
        label.setAttribute('font-size', 14);
        label.setAttribute('font-weight', 700);
        label.setAttribute('fill', '#c0392b');
        label.textContent = `${sec}s → ${y_sec}m`;
        dot.appendChild(label);
        trail.appendChild(dot);
      }
    }
  }

  function updateSpeedLabel() {
    speedVal.textContent = '×' + Number(speedInput.value).toFixed(1);
  }
  speedInput.addEventListener('input', updateSpeedLabel);

  let lastTs = null;
  function tick(ts) {
    if (!playing) return;
    if (lastTs == null) lastTs = ts;
    const dt_sec_real = (ts - lastTs) / 1000;
    lastTs = ts;
    const speed = parseFloat(speedInput.value);
    t = Math.min(MAX_T, t + dt_sec_real * speed);
    render(t);
    if (t >= MAX_T) {
      playing = false;
      lastTs = null;
      return;
    }
    lastRaf = requestAnimationFrame(tick);
  }

  function play() {
    if (t >= MAX_T) return;
    if (playing) return;
    playing = true; lastTs = null;
    lastRaf = requestAnimationFrame(tick);
  }
  function pause() {
    playing = false; lastTs = null;
    if (lastRaf) cancelAnimationFrame(lastRaf);
  }
  function reset() {
    pause();
    t = 0;
    hits = { 1: false, 2: false, 3: false, 4: false, 5: false };
    for (const sec of [1, 2, 3, 4, 5]) {
      yCells[sec].textContent = '?';
      yCells[sec].classList.remove('hit');
    }
    trail.innerHTML = '';
    render(0);
  }
  function stepOneSec() {
    pause();
    // 次の整数秒へ
    const nextT = Math.min(MAX_T, Math.floor(t + 1e-6) + 1);
    const steps = 24;
    const dur = 600; // ms でアニメ補間
    const start = performance.now();
    const from = t;
    const to = nextT;
    function anim(now) {
      const r = Math.min(1, (now - start) / dur);
      // easeInQuad で加速感
      const eased = r;
      t = from + (to - from) * eased;
      render(t);
      if (r < 1) requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  btnPlay.addEventListener('click', play);
  btnPause.addEventListener('click', pause);
  btnReset.addEventListener('click', reset);
  btnStep.addEventListener('click', stepOneSec);

  // キーボードショートカット
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 's' || e.key === 'S') stepOneSec();
  });

  updateSpeedLabel();
  render(0);
})();
</script>

</body>
</html>
