<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>制動距離シミュレーター</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Yu Gothic", "游ゴシック", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #cfe8ff 0%, #87c0ea 60%, #4a7cb0 100%);
    color: #1a2a44;
    margin: 0;
    min-height: 100vh;
    padding: 12px;
  }
  body.icy {
    background: linear-gradient(180deg, #e8f4ff 0%, #a8ccea 60%, #6c8ba8 100%);
  }
  h1 {
    text-align: center;
    margin: 0 0 10px;
    font-size: 22px;
    color: #1a2a44;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(255,255,255,.6);
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    gap: 12px;
  }
  .controls, .stage, .readout {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .controls {
    display: grid;
    gap: 10px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .label {
    font-weight: 700;
    color: #1a2a44;
    font-size: 14px;
    min-width: 90px;
  }
  .speed-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }
  .speed-btn {
    font: inherit;
    padding: 10px 14px;
    border: 2px solid #1565c0;
    background: #fff;
    color: #1565c0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    transition: background .15s, color .15s, transform .08s;
    font-family: "Cambria Math", serif;
  }
  .speed-btn:hover { background: #e3f2fd; }
  .speed-btn:active { transform: scale(.96); }
  .speed-btn.active {
    background: #1565c0;
    color: #fff;
    box-shadow: 0 2px 4px rgba(21,101,192,.4);
  }
  .road-switch {
    display: flex;
    gap: 4px;
    background: #e0e0e0;
    padding: 4px;
    border-radius: 8px;
  }
  .road-switch button {
    font: inherit;
    padding: 8px 14px;
    border: 0;
    background: transparent;
    color: #5c6b80;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }
  .road-switch button.active {
    background: #fff;
    color: #1a2a44;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .action-btns {
    display: flex;
    gap: 8px;
  }
  .btn-go {
    flex: 1;
    font: inherit;
    padding: 14px 10px;
    border: 2px solid #2e7d32;
    background: #43a047;
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 3px 0 #2e7d32;
    transition: transform .08s, background .15s;
  }
  .btn-go:hover:not(:disabled) { background: #4caf50; }
  .btn-go:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2e7d32;
  }
  .btn-go:disabled {
    background: #bdbdbd;
    border-color: #9e9e9e;
    box-shadow: 0 3px 0 #9e9e9e;
    cursor: not-allowed;
  }
  .btn-stop {
    flex: 1;
    font: inherit;
    padding: 14px 10px;
    border: 2px solid #b71c1c;
    background: #e53935;
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 3px 0 #b71c1c;
    transition: transform .08s, background .15s;
  }
  .btn-stop:hover:not(:disabled) { background: #ef5350; }
  .btn-stop:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b71c1c;
  }
  .btn-stop:disabled {
    background: #bdbdbd;
    border-color: #9e9e9e;
    box-shadow: 0 3px 0 #9e9e9e;
    cursor: not-allowed;
  }
  .btn-reset {
    font: inherit;
    padding: 14px 16px;
    border: 2px solid #b0bec5;
    background: #fff;
    color: #5c6b80;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }
  .btn-reset:hover { background: #eceff1; }
  .stage {
    padding: 0;
    overflow: hidden;
  }
  svg.scene {
    display: block;
    width: 100%;
    height: auto;
    max-height: 55vh;
  }
  .readout {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .readout .cell {
    padding: 6px;
  }
  .readout .lbl {
    font-size: 12px;
    color: #5c6b80;
    font-weight: 700;
  }
  .readout .val {
    font-family: "Cambria Math", serif;
    font-weight: 700;
    font-size: 24px;
    color: #c0392b;
    letter-spacing: 1px;
  }
  .readout .val.blue { color: #1565c0; }
  .readout .val.green { color: #2e7d32; }
  .readout .unit {
    font-size: 14px;
    color: #5c6b80;
    font-weight: 500;
    margin-left: 2px;
  }
  .result-banner {
    background: linear-gradient(135deg, #c0392b, #8b2318);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    display: none;
  }
  .result-banner.show { display: block; }
  .result-banner .big {
    font-size: 32px;
    font-family: "Cambria Math", serif;
    letter-spacing: 1px;
    display: inline-block;
    margin: 0 6px;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #5c6b80;
    padding: 4px;
  }
  @media (max-width: 820px) {
    h1 { font-size: 18px; }
    .readout .val { font-size: 20px; }
    .speed-btn { padding: 8px 10px; font-size: 13px; }
    .label { min-width: 70px; font-size: 13px; }
  }
</style>
</head>
<body>

<h1>🚗 制動距離シミュレーター</h1>

<div class="wrap">
  <div class="controls">
    <div class="row">
      <span class="label">① 速さ</span>
      <div class="speed-btns" id="speedBtns">
        <!-- JS で生成 -->
      </div>
    </div>
    <div class="row">
      <span class="label">② 道路</span>
      <div class="road-switch">
        <button id="btnDry" class="active">🛣 乾いた道</button>
        <button id="btnIcy">❄ 凍結路面</button>
      </div>
    </div>
    <div class="row action-btns">
      <button class="btn-go" id="btnGo">▶ スタート</button>
      <button class="btn-stop" id="btnStop" disabled>⛔ ストップ</button>
      <button class="btn-reset" id="btnReset">🔄 リセット</button>
    </div>
  </div>

  <div class="stage">
    <svg class="scene" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet">
      <!-- 空の背景（body の背景と馴染ませる・無色矩形で領域だけ確保） -->

      <!-- 遠景（山、雲 - お好み装飾） -->
      <g id="scenery">
        <!-- 雲 -->
        <ellipse cx="200" cy="55" rx="40" ry="12" fill="#fff" opacity="0.85"/>
        <ellipse cx="230" cy="50" rx="35" ry="14" fill="#fff" opacity="0.85"/>
        <ellipse cx="800" cy="40" rx="35" ry="11" fill="#fff" opacity="0.75"/>
        <ellipse cx="830" cy="48" rx="40" ry="14" fill="#fff" opacity="0.75"/>
        <!-- 山 -->
        <polygon points="100,250 250,100 400,250" fill="#78909c" opacity="0.5"/>
        <polygon points="550,250 700,120 850,250" fill="#607d8b" opacity="0.5"/>
      </g>

      <!-- 地面（土の帯） -->
      <rect x="0" y="250" width="1200" height="150" fill="#a1887f"/>

      <!-- 道路（JS で色を変える） -->
      <rect id="road" x="0" y="260" width="1200" height="80" fill="#424242"/>
      <!-- 道路の中央線（破線） -->
      <line id="centerLine" x1="0" y1="300" x2="1200" y2="300"
            stroke="#fff176" stroke-width="3" stroke-dasharray="24,16"/>
      <!-- 凍結の氷パッチ（JS で表示/非表示） -->
      <g id="icePatches" style="display:none">
        <ellipse cx="150" cy="305" rx="45" ry="10" fill="#e3f2fd" opacity="0.8"/>
        <ellipse cx="320" cy="315" rx="55" ry="12" fill="#e3f2fd" opacity="0.75"/>
        <ellipse cx="500" cy="305" rx="40" ry="9" fill="#e3f2fd" opacity="0.8"/>
        <ellipse cx="680" cy="320" rx="60" ry="11" fill="#e3f2fd" opacity="0.75"/>
        <ellipse cx="880" cy="305" rx="50" ry="10" fill="#e3f2fd" opacity="0.8"/>
        <ellipse cx="1060" cy="315" rx="45" ry="12" fill="#e3f2fd" opacity="0.75"/>
      </g>

      <!-- 目盛り（距離 m） -->
      <g id="ruler"></g>

      <!-- ブレーキ開始線（ストップボタンで表示） -->
      <g id="brakeMarker" style="display:none">
        <line x1="0" y1="245" x2="0" y2="350" stroke="#e53935" stroke-width="3" stroke-dasharray="4,3"/>
        <rect x="-32" y="225" width="64" height="20" rx="4" fill="#e53935"/>
        <text x="0" y="240" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ブレーキ</text>
      </g>

      <!-- 停止マーカー（止まったら表示） -->
      <g id="stopMarker" style="display:none">
        <line x1="0" y1="245" x2="0" y2="350" stroke="#2e7d32" stroke-width="3"/>
        <rect x="-32" y="225" width="64" height="20" rx="4" fill="#2e7d32"/>
        <text x="0" y="240" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">停止!</text>
      </g>

      <!-- 車（SVG グループ） -->
      <g id="car" transform="translate(0, 0)">
        <!-- タイヤ（下） -->
        <circle cx="-25" cy="25" r="10" fill="#263238"/>
        <circle cx="25" cy="25" r="10" fill="#263238"/>
        <circle cx="-25" cy="25" r="4" fill="#546e7a"/>
        <circle cx="25" cy="25" r="4" fill="#546e7a"/>
        <!-- ボディ（赤） -->
        <path d="M -40,10 L -30,-10 L 20,-10 L 30,-5 L 40,10 Z"
              fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
        <!-- フロントガラス -->
        <path d="M -22,-8 L -14,-20 L 10,-20 L 18,-8 Z"
              fill="#90caf9" stroke="#1565c0" stroke-width="1"/>
        <!-- ヘッドライト -->
        <circle cx="38" cy="5" r="3" fill="#fff176"/>
        <!-- ドアライン -->
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#b71c1c" stroke-width="1"/>
      </g>

      <!-- ブレーキのエフェクト（タイヤの跡）- JS で動的に線を追加 -->
      <g id="skidMarks"></g>
    </svg>
  </div>

  <div class="readout">
    <div class="cell">
      <div class="lbl">時刻</div>
      <div><span class="val blue" id="valTime">0.0</span><span class="unit">秒</span></div>
    </div>
    <div class="cell">
      <div class="lbl">現在の速度</div>
      <div><span class="val" id="valSpeed">0</span><span class="unit">km/h</span></div>
    </div>
    <div class="cell">
      <div class="lbl">制動距離</div>
      <div><span class="val green" id="valDist">—</span><span class="unit">m</span></div>
    </div>
  </div>

  <div class="result-banner" id="resultBanner">
    制動距離は　<span class="big" id="resultDist">—</span> m！
  </div>

  <div class="hint">★ ① 速さと道路を選ぶ　② ▶ スタート で車を走らせる　③ ⛔ ストップ で ブレーキ　→　止まるまでの距離が「制動距離」！</div>
</div>

<script>
(function() {
  // ===== 設定 =====
  const SPEEDS = [10, 20, 30, 40, 50, 60, 100];
  const COEF_DRY = 0.006;   // y = 0.006 x² (教科書)
  const COEF_ICY = 0.024;   // 凍結路面：約 4 倍

  // 道路の表示範囲（m）→ SVG 座標
  const ROAD_MAX_M = 300;    // 300m まで表示（凍結路面 100 km/h の 240m にも対応）
  const SVG_W = 1200;
  const PX_PER_M = SVG_W / ROAD_MAX_M;  // 4px/m

  // 車のスタート位置
  const CAR_START_PX = 60;
  const BRAKE_LINE_PX = CAR_START_PX;

  // ===== DOM =====
  const speedBtnsEl = document.getElementById('speedBtns');
  const btnDry = document.getElementById('btnDry');
  const btnIcy = document.getElementById('btnIcy');
  const btnGo  = document.getElementById('btnGo');
  const btnStop = document.getElementById('btnStop');
  const btnReset = document.getElementById('btnReset');
  const car = document.getElementById('car');
  const road = document.getElementById('road');
  const centerLine = document.getElementById('centerLine');
  const icePatches = document.getElementById('icePatches');
  const ruler = document.getElementById('ruler');
  const brakeMarker = document.getElementById('brakeMarker');
  const stopMarker = document.getElementById('stopMarker');
  const skidMarks = document.getElementById('skidMarks');
  const valTime = document.getElementById('valTime');
  const valSpeed = document.getElementById('valSpeed');
  const valDist = document.getElementById('valDist');
  const resultBanner = document.getElementById('resultBanner');
  const resultDist = document.getElementById('resultDist');

  // ===== 速さボタン生成 =====
  let selectedSpeed = 50;
  SPEEDS.forEach(v => {
    const b = document.createElement('button');
    b.className = 'speed-btn' + (v === selectedSpeed ? ' active' : '');
    b.textContent = v + ' km/h';
    b.addEventListener('click', () => {
      selectedSpeed = v;
      document.querySelectorAll('.speed-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    });
    speedBtnsEl.appendChild(b);
  });

  // ===== 道路切り替え =====
  let isIcy = false;
  function setRoad(icy) {
    isIcy = icy;
    btnDry.classList.toggle('active', !icy);
    btnIcy.classList.toggle('active', icy);
    if (icy) {
      road.setAttribute('fill', '#90a4ae');  // 青灰
      centerLine.setAttribute('stroke', '#eceff1');
      icePatches.style.display = '';
      document.body.classList.add('icy');
    } else {
      road.setAttribute('fill', '#424242');
      centerLine.setAttribute('stroke', '#fff176');
      icePatches.style.display = 'none';
      document.body.classList.remove('icy');
    }
    reset();
  }
  btnDry.addEventListener('click', () => setRoad(false));
  btnIcy.addEventListener('click', () => setRoad(true));

  // ===== 目盛り生成 =====
  // 300m を 20m 刻みで表示（密になりすぎず読みやすく）
  function drawRuler() {
    ruler.innerHTML = '';
    for (let m = 0; m <= ROAD_MAX_M; m += 10) {
      const x = CAR_START_PX + m * PX_PER_M;
      if (x > SVG_W - 10) break;
      const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      tick.setAttribute('x1', x); tick.setAttribute('x2', x);
      tick.setAttribute('y1', 345); tick.setAttribute('y2', m % 20 === 0 ? 355 : 350);
      tick.setAttribute('stroke', '#424242');
      tick.setAttribute('stroke-width', m % 100 === 0 ? 2 : 1);
      ruler.appendChild(tick);
      if (m % 20 === 0) {
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', x); label.setAttribute('y', 372);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-size', 11);
        label.setAttribute('fill', '#263238');
        label.setAttribute('font-family', 'Cambria Math');
        label.textContent = m + 'm';
        ruler.appendChild(label);
      }
    }
  }

  // マーカー配置
  function placeBrakeMarker(xPx) {
    brakeMarker.setAttribute('transform', `translate(${xPx}, 0)`);
    brakeMarker.style.display = '';
  }
  function hideBrakeMarker() { brakeMarker.style.display = 'none'; }
  function placeStopMarker(xPx) {
    stopMarker.setAttribute('transform', `translate(${xPx}, 0)`);
    stopMarker.style.display = '';
  }
  function hideStopMarker() { stopMarker.style.display = 'none'; }

  // ===== アニメーション状態 =====
  let anim = null;
  let state = 'idle';   // idle | driving | braking | stopped
  let startTs = 0;      // アニメ全体の開始時刻
  let brakeTs = 0;      // ブレーキ開始時刻（アニメ内）
  let brakeDist = 0;    // スタートからブレーキ開始までの走行距離 (m)
  let stopDist = 0;     // ブレーキ開始後、停止までに走る距離 (= 制動距離)
  let brakeDur = 0;     // ブレーキ時間
  let a = 0;            // 減速度
  let v0_mps = 0;       // 初速（m/s）

  function placeCar(xPx) {
    car.setAttribute('transform', `translate(${xPx}, 310)`);
  }
  placeCar(CAR_START_PX);
  drawRuler();

  function reset() {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    state = 'idle';
    placeCar(CAR_START_PX);
    hideBrakeMarker();
    hideStopMarker();
    skidMarks.innerHTML = '';
    valTime.textContent = '0.00';
    valSpeed.textContent = selectedSpeed;
    valDist.textContent = '—';
    resultBanner.classList.remove('show');
    btnGo.disabled = false;
    btnGo.textContent = '▶ スタート';
    btnStop.disabled = true;
  }

  // ===== スタート =====
  function start() {
    if (state !== 'idle') return;
    const v_kmh = selectedSpeed;
    v0_mps = v_kmh / 3.6;
    state = 'driving';
    startTs = performance.now();
    btnGo.disabled = true;
    btnGo.textContent = '走行中…';
    btnStop.disabled = false;
    anim = requestAnimationFrame(tick);
  }

  // ===== ストップ（ブレーキ開始） =====
  function stop() {
    if (state !== 'driving') return;
    // 現在の走行距離（スタートからの秒数 × 初速）
    const now = performance.now();
    const t = (now - startTs) / 1000;
    brakeDist = v0_mps * t;
    const brakeX = CAR_START_PX + brakeDist * PX_PER_M;
    placeBrakeMarker(brakeX);

    // 制動距離の計算
    const v_kmh = selectedSpeed;
    const coef = isIcy ? COEF_ICY : COEF_DRY;
    stopDist = coef * v_kmh * v_kmh;
    a = (v0_mps * v0_mps) / (2 * stopDist);
    brakeDur = v0_mps / a;
    brakeTs = now;
    state = 'braking';
    btnStop.disabled = true;
    btnGo.textContent = 'ブレーキ中…';
  }

  // ===== メインループ =====
  function tick(now) {
    const totalT = (now - startTs) / 1000;

    if (state === 'driving') {
      const dist_m = v0_mps * totalT;
      const carX = CAR_START_PX + dist_m * PX_PER_M;
      placeCar(carX);
      valTime.textContent = totalT.toFixed(2);
      valSpeed.textContent = selectedSpeed;
      valDist.textContent = '—';

      // 残り距離が制動距離を下回ったら 自動ブレーキ（画面外に飛び出さないように）
      const coef = isIcy ? COEF_ICY : COEF_DRY;
      const expectedBrakeDist = coef * selectedSpeed * selectedSpeed;
      const remaining_m = ROAD_MAX_M - dist_m;
      if (expectedBrakeDist + 5 > remaining_m) {
        stop();
      }
    } else if (state === 'braking') {
      const bt = (now - brakeTs) / 1000;
      let brakingDist_m, curV_mps;
      if (bt >= brakeDur) {
        brakingDist_m = stopDist;
        curV_mps = 0;
        state = 'stopped';
      } else {
        brakingDist_m = v0_mps * bt - 0.5 * a * bt * bt;
        curV_mps = v0_mps - a * bt;
      }
      const totalDist_m = brakeDist + brakingDist_m;
      const carX = CAR_START_PX + totalDist_m * PX_PER_M;
      placeCar(carX);

      // スキッドマーク
      const brakeX = CAR_START_PX + brakeDist * PX_PER_M;
      if (skidMarks.children.length === 0) {
        const skid = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        skid.setAttribute('x1', brakeX);
        skid.setAttribute('x2', carX);
        skid.setAttribute('y1', 335);
        skid.setAttribute('y2', 335);
        skid.setAttribute('stroke', '#1a1a1a');
        skid.setAttribute('stroke-width', 1.5);
        skid.setAttribute('opacity', 0.6);
        skidMarks.appendChild(skid);
      } else {
        skidMarks.children[0].setAttribute('x2', carX);
      }

      valTime.textContent = totalT.toFixed(2);
      valSpeed.textContent = Math.max(0, curV_mps * 3.6).toFixed(0);
      valDist.textContent = brakingDist_m.toFixed(1);

      if (state === 'stopped') {
        placeStopMarker(carX);
        resultDist.textContent = stopDist.toFixed(1);
        resultBanner.classList.add('show');
        btnGo.disabled = true;
        btnGo.textContent = '停止！';
        btnStop.disabled = true;
        anim = null;
        return;
      }
    }
    anim = requestAnimationFrame(tick);
  }

  btnGo.addEventListener('click', start);
  btnStop.addEventListener('click', stop);
  btnReset.addEventListener('click', reset);

  // 初期化
  reset();
})();
</script>

</body>
</html>
